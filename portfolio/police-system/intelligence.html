<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情資與監控中心</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        if (localStorage.getItem('police_token') !== 'valid') { window.location.href = 'login.html'; }
    </script>
    <style>
        :root { --bg-dark: #0f172a; --card-bg: #1e293b; --text-light: #f1f5f9; }
        body { background-color: var(--bg-dark); color: var(--text-light); font-family: 'Segoe UI', sans-serif; }
        
        /* Sidebar Styling - White Text */
        .sidebar { height: 100vh; position: fixed; width: 250px; background-color: #111827; border-right: 1px solid #334151; padding-top: 20px; z-index: 1000;}
        .sidebar a { color: #ffffff !important; padding: 12px 25px; display: block; text-decoration: none; transition: 0.3s; font-weight: 500; }
        .sidebar a:hover, .sidebar a.active { background-color: rgba(56, 189, 248, 0.1); color: #38bdf8 !important; border-left: 4px solid #38bdf8; }
        .sidebar .text-muted { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-top: 20px; margin-bottom: 5px; padding-left: 25px; color: #e2e8f0 !important; }

        .main-content { margin-left: 250px; padding: 20px; }

        .card { background-color: var(--card-bg); border: 1px solid #334155; }
        .form-control { background-color: #0f172a; border: 1px solid #475569; color: white; }
        .form-control:focus { background-color: #0f172a; color: white; border-color: #0ea5e9; }
        
        .cctv-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .cctv-box { background: black; height: 200px; position: relative; border: 1px solid #334155; }
        .cctv-label { position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.6); color: #00ff00; padding: 2px 5px; font-size: 0.8rem; font-family: monospace; }
        .cctv-content { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        
        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; display: flex; overflow-x: auto; padding: 10px 0; border-bottom: 1px solid #334155; }
            .sidebar a { flex: 0 0 auto; padding: 8px 15px; border-left: none; }
            .sidebar .text-muted, .sidebar .text-center { display: none; }
            .main-content { margin-left: 0; padding: 10px; }
            .cctv-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="text-center mb-4"><h4 class="text-white fw-bold"><i class="fa-solid fa-shield-cat me-2"></i>警務戰情</h4></div>
        <div class="text-muted">指揮作戰</div>
        <a href="dashboard.html"><i class="fa-solid fa-chart-line me-2"></i>戰情總覽</a>
        <a href="intelligence.html" class="active"><i class="fa-solid fa-eye me-2"></i>情資監控</a>
        <div class="text-muted">資源後勤</div>
        <a href="personnel.html"><i class="fa-solid fa-users me-2"></i>警力人事</a>
        <a href="equipment.html"><i class="fa-solid fa-gun me-2"></i>裝備倉儲</a>
        <div class="text-muted">分析決策</div>
        <a href="analysis.html"><i class="fa-solid fa-chart-pie me-2"></i>數據中心</a>
        <a href="records.html"><i class="fa-solid fa-folder-open me-2"></i>案卷紀錄</a>
        <div class="text-muted">輔助系統</div>
        <a href="knowledge.html"><i class="fa-solid fa-book me-2"></i>SOP 規章</a>
        <a href="ai_chat.html"><i class="fa-solid fa-robot me-2"></i>智慧助理</a>
        <a href="#" onclick="logout()" class="mt-4 text-danger"><i class="fa-solid fa-right-from-bracket me-2"></i>登出</a>
    </div>

    <div class="main-content">
        <h2 class="text-light mb-4">情資與監控中心 <span class="badge bg-danger fs-6 align-middle"><i class="fa-solid fa-circle fa-beat-fade me-1"></i> LIVE</span></h2>

        <div class="row">
            <div class="col-lg-4 mb-4">
                <div class="card h-100">
                    <div class="card-header border-secondary text-info"><i class="fa-solid fa-database me-2"></i>資料庫查詢</div>
                    <div class="card-body">
                        <label class="text-muted small mb-2">身分證字號 / 車牌</label>
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" id="searchInput" placeholder="例如: B123456789">
                            <button class="btn btn-primary" onclick="searchDB()">查詢</button>
                        </div>
                        <div id="searchResult" class="p-3 bg-black border border-secondary rounded" style="display:none; min-height: 100px;"></div>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header border-secondary text-warning"><i class="fa-solid fa-video me-2"></i>即時影像監控</div>
                    <div class="card-body p-2">
                        <div class="cctv-grid">
                            <div class="cctv-box">
                                <span class="cctv-label">CAM-01 市政路口</span>
                                <img src="https://images.unsplash.com/photo-1541469080526-347206b00d34?q=80&w=600&auto=format&fit=crop" class="cctv-content">
                            </div>
                            <div class="cctv-box">
                                <span class="cctv-label">CAM-02 捷運站前</span>
                                <img src="https://images.unsplash.com/photo-1574359252431-7eec5d9eb393?q=80&w=600&auto=format&fit=crop" class="cctv-content">
                            </div>
                            <div class="cctv-box">
                                <span class="cctv-label">CAM-03 交流道</span>
                                <img src="https://images.unsplash.com/photo-1626248356973-20677579f13e?q=80&w=600&auto=format&fit=crop" class="cctv-content">
                            </div>
                            <div class="cctv-box">
                                <span class="cctv-label">CAM-04 夜市周邊</span>
                                <img src="https://images.unsplash.com/photo-1579782504812-70b1341c8f17?q=80&w=600&auto=format&fit=crop" class="cctv-content">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function logout() { localStorage.removeItem('police_token'); window.location.href = 'login.html'; }

        function searchDB() {
            const val = document.getElementById('searchInput').value;
            const res = document.getElementById('searchResult');
            
            res.style.display = 'block';
            res.innerHTML = '<div class="text-center text-muted mt-4"><i class="fa-solid fa-spinner fa-spin"></i> 資料檢索中...</div>';
            
            setTimeout(() => {
                if(!val) {
                    res.innerHTML = '<div class="text-danger text-center mt-3">請輸入查詢條件</div>';
                    return;
                }
                // Mock result
                const isDanger = Math.random() > 0.5;
                res.innerHTML = `
                    <div class="mt-2">
                        <h5 class="${isDanger?'text-danger':'text-success'} fw-bold">${isDanger?'⚠ 通緝中':'✔ 無前科紀錄'}</h5>
                        <p class="mb-1 text-light">查詢對象：<span class="text-info">${val}</span></p>
                        <p class="mb-0 text-secondary small">最後更新：剛剛</p>
                    </div>
                `;
            }, 800);
        }
    </script>
</body>
</html>
