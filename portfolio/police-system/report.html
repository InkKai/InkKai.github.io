<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案件結案報告書</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script>
        if (localStorage.getItem('police_token') !== 'valid') {
            alert("⛔ 非法存取！請先登入系統。");
            window.location.href = 'login.html';
        }
    </script>

    <style>
        body { background-color: #0f172a; color: #f1f5f9; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .report-card { background-color: #1e293b; border: 1px solid #334155; padding: 2rem; border-radius: 10px; width: 100%; max-width: 600px; }
        .form-control, .form-select { background-color: #0f172a; border: 1px solid #334155; color: white; }
        .form-control:disabled { background-color: #334155; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="report-card">
        <h3 class="mb-4 text-center border-bottom border-secondary pb-3">案件結案報告書</h3>
        
        <form id="closeCaseForm">
            <div class="row mb-3">
                <div class="col-6">
                    <label class="text-secondary">案件編號</label>
                    <input type="text" id="caseId" class="form-control" disabled>
                </div>
                <div class="col-6">
                    <label class="text-secondary">案件類型</label>
                    <input type="text" id="caseType" class="form-control" disabled>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="text-secondary">承辦員警</label>
                <input type="text" id="caseOfficer" class="form-control text-warning" disabled>
            </div>

            <div class="mb-3">
                <label class="text-secondary">發生地點</label>
                <input type="text" id="caseLoc" class="form-control" disabled>
            </div>

            <div class="mb-3">
                <label>處置結果 / 結案說明</label>
                <textarea class="form-control" id="caseResult" rows="4" placeholder="請詳細描述處理經過與結果..."></textarea>
            </div>

            <div class="d-flex justify-content-between mt-4">
                <a href="dashboard.html" class="btn btn-outline-secondary">返回儀表板</a>
                <button type="button" class="btn btn-success" onclick="submitCloseCase()">確認結案並歸檔</button>
            </div>
        </form>
    </div>

    <script>
        /* === 1. 定義 Log 寫入工具 (這是您原本缺少的) === */
        function logToSystem(action, detail) {
            const currentUser = localStorage.getItem('current_user') || 'Unknown';
            const now = new Date().toLocaleString('zh-TW', { hour12: false });
            const newLog = {
                time: now,
                user: currentUser,
                action: action,
                detail: detail,
                ip: "192.168.1." + Math.floor(Math.random() * 255)
            };
            let logs = JSON.parse(localStorage.getItem('police_logs')) || [];
            logs.push(newLog);
            if(logs.length > 50) logs.shift();
            localStorage.setItem('police_logs', JSON.stringify(logs));
        }

        // 2. 取得資料
        const urlParams = new URLSearchParams(window.location.search);
        const targetId = parseInt(urlParams.get('id'));
        let incidents = JSON.parse(localStorage.getItem('police_incidents')) || [];
        let currentCase = incidents.find(inc => inc.id === targetId);

        if (currentCase) {
            document.getElementById('caseId').value = "#" + currentCase.id;
            document.getElementById('caseType').value = currentCase.type;
            document.getElementById('caseLoc').value = currentCase.location;
            document.getElementById('caseOfficer').value = currentCase.assignedTo ? currentCase.assignedTo : "未指定";
            
            if(currentCase.result) document.getElementById('caseResult').value = currentCase.result;
            
            if(currentCase.status === '已結案') {
                document.getElementById('caseResult').disabled = true;
                document.querySelector('.btn-success').style.display = 'none';
            }
        } else {
            alert("找不到此案件！");
            window.location.href = 'dashboard.html';
        }

        // 3. 提交結案 (含 Log 寫入)
        function submitCloseCase() {
            const resultText = document.getElementById('caseResult').value;
            if(!resultText) { alert("請填寫處理結果！"); return; }

            // A. 更新案件
            currentCase.status = "已結案";
            currentCase.result = resultText;
            localStorage.setItem('police_incidents', JSON.stringify(incidents));

            // B. 釋放員警
            if (currentCase.assignedTo) {
                let officerId = currentCase.assignedTo.split(' ')[0];
                let officers = JSON.parse(localStorage.getItem('police_officers')) || [];
                let officerIndex = officers.findIndex(o => o.id === officerId);

                if (officerIndex !== -1) {
                    officers[officerIndex].status = "待命";
                    officers[officerIndex].task = "所內待命";
                    localStorage.setItem('police_officers', JSON.stringify(officers));
                }
            }

            // ★★★ C. 寫入系統日誌 (補上這一段) ★★★
            logToSystem('案件結案', `案件 #${currentCase.id} 已歸檔。結果：${resultText.substring(0, 10)}...`);

            alert("案件已歸檔！承辦員警狀態已恢復為「待命」。");
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
