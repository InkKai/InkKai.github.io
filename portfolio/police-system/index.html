<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>警務指揮決策系統 - 登入</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.95)), url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            background-color: rgba(30, 41, 59, 0.95);
            border: 1px solid #475569;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        
        .btn-police {
            background-color: #0ea5e9;
            color: white;
            font-weight: 600;
            padding: 12px;
            letter-spacing: 0.5px;
            transition: 0.3s;
        }
        .btn-police:hover {
            background-color: #0284c7;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.6);
            color: white;
        }
        .system-logo {
            font-size: 4rem;
            text-align: center;
            margin-bottom: 1rem;
            color: #38bdf8;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
        }
        .form-control {
            background-color: #1e293b;
            border: 1px solid #475569;
            border-left: none;
            color: white !important;
            padding: 12px;
        }
        .form-control:focus {
            background-color: #1e293b;
            color: white;
            border-color: #0ea5e9;
            box-shadow: none;
        }
        .input-group-text {
            background-color: #334155;
            border: 1px solid #475569;
            color: #94a3b8;
            border-right: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="system-logo"><i class="fa-solid fa-shield-cat"></i></div>
        <h4 class="text-center mb-1 fw-bold text-white">警務指揮決策系統</h4>
        <p class="text-center text-secondary mb-4 small">Police Command System v2.0</p>
        
        <form onsubmit="event.preventDefault(); handleLogin();">
            <div class="mb-3">
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="userId" class="form-control" placeholder="帳號 (admin)" required>
                </div>
            </div>
            <div class="mb-4">
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="userPass" class="form-control" placeholder="密碼 (1234)" required>
                </div>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-police" id="loginBtn">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> 登入系統
                </button>
            </div>
        </form>
        
        <div id="msgBox" class="mt-3 text-center small" style="min-height: 20px;"></div>
    </div>

    <script>
        localStorage.removeItem('police_token');

        function handleLogin() {
            const id = document.getElementById('userId').value;
            const pass = document.getElementById('userPass').value;
            const btn = document.getElementById('loginBtn');
            const msg = document.getElementById('msgBox');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> 驗證中...';
            msg.innerHTML = '';

            setTimeout(() => {
                if (id === 'admin' && pass === '1234') {
                    localStorage.setItem('police_token', 'valid');
                    localStorage.setItem('current_user', 'Admin');
                    
                    msg.className = 'text-success fw-bold';
                    msg.innerHTML = '<i class="fa-solid fa-check-circle"></i> 登入成功，正在跳轉...';
                    
                    setTimeout(() => window.location.href = 'dashboard.html', 800);
                } else {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i> 登入系統';
                    
                    msg.className = 'text-danger';
                    msg.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> 帳號或密碼錯誤 (admin / 1234)';
                }
            }, 800);
        }
    </script>
</body>
</html>
