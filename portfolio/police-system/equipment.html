<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>裝備械彈管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        if (localStorage.getItem('police_token') !== 'valid') { window.location.href = 'login.html'; }
    </script>
    <style>
        :root { --bg-dark: #0f172a; --card-bg: #1e293b; --text-light: #f1f5f9; }
        body { background-color: var(--bg-dark); color: var(--text-light); font-family: 'Segoe UI', sans-serif; }
        
        /* Sidebar Styling - White Text */
        .sidebar { height: 100vh; position: fixed; width: 250px; background-color: #111827; border-right: 1px solid #334151; padding-top: 20px; z-index: 1000;}
        .sidebar a { color: #ffffff !important; padding: 12px 25px; display: block; text-decoration: none; transition: 0.3s; font-weight: 500; }
        .sidebar a:hover, .sidebar a.active { background-color: rgba(56, 189, 248, 0.1); color: #38bdf8 !important; border-left: 4px solid #38bdf8; }
        .sidebar .text-muted { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-top: 20px; margin-bottom: 5px; padding-left: 25px; color: #e2e8f0 !important; }
        
        .main-content { margin-left: 250px; padding: 20px; }

        .card { background-color: var(--card-bg); border: 1px solid #334155; }
        .table-dark { background-color: var(--card-bg); --bs-table-bg: var(--card-bg); }
        
        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; display: flex; overflow-x: auto; padding: 10px 0; border-bottom: 1px solid #334155; }
            .sidebar a { flex: 0 0 auto; padding: 8px 15px; border-left: none; }
            .sidebar .text-muted, .sidebar .text-center { display: none; }
            .main-content { margin-left: 0; padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="text-center mb-4"><h4 class="text-white fw-bold"><i class="fa-solid fa-shield-cat me-2"></i>警務戰情</h4></div>
        <div class="text-muted">指揮作戰</div>
        <a href="dashboard.html"><i class="fa-solid fa-chart-line me-2"></i>戰情總覽</a>
        <a href="intelligence.html"><i class="fa-solid fa-eye me-2"></i>情資監控</a>
        <div class="text-muted">資源後勤</div>
        <a href="personnel.html"><i class="fa-solid fa-users me-2"></i>警力人事</a>
        <a href="equipment.html" class="active"><i class="fa-solid fa-gun me-2"></i>裝備倉儲</a>
        <div class="text-muted">分析決策</div>
        <a href="analysis.html"><i class="fa-solid fa-chart-pie me-2"></i>數據中心</a>
        <a href="records.html"><i class="fa-solid fa-folder-open me-2"></i>案卷紀錄</a>
        <div class="text-muted">輔助系統</div>
        <a href="knowledge.html"><i class="fa-solid fa-book me-2"></i>SOP 規章</a>
        <a href="ai_chat.html"><i class="fa-solid fa-robot me-2"></i>智慧助理</a>
        <a href="#" onclick="logout()" class="mt-4 text-danger"><i class="fa-solid fa-right-from-bracket me-2"></i>登出</a>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-light">裝備械彈庫存 (Armory)</h2>
            <button class="btn btn-warning text-dark" data-bs-toggle="modal" data-bs-target="#actionModal"><i class="fa-solid fa-right-left"></i> 領用 / 歸還登記</button>
        </div>

        <div class="row mb-4" id="invGrid"></div>
        
        <h5 class="text-secondary mb-3">近期異動紀錄</h5>
        <div class="card p-0">
            <table class="table table-dark table-hover mb-0">
                <thead><tr><th>動作</th><th>裝備</th><th>人員</th><th>時間</th></tr></thead>
                <tbody id="logBody"></tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="actionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-light border-secondary">
                <div class="modal-header border-secondary"><h5 class="modal-title">裝備登記</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <div class="mb-3"><label>動作</label><select class="form-select bg-dark text-light border-secondary" id="actType"><option value="borrow">🔴 領用 (出庫)</option><option value="return">🟢 歸還 (入庫)</option></select></div>
                    <div class="mb-3"><label>裝備</label><select class="form-select bg-dark text-light border-secondary" id="actItem"><option value="PPQ手槍">PPQ M2 手槍</option><option value="無線電">警用無線電</option><option value="密錄器">微型攝影機</option><option value="電擊槍">電擊槍</option></select></div>
                    <div class="mb-3"><label>人員</label><input type="text" class="form-control bg-dark text-light border-secondary" id="actUser" placeholder="輸入員警姓名"></div>
                </div>
                <div class="modal-footer border-secondary"><button class="btn btn-primary" onclick="submitAction()">確認</button></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function logout() { localStorage.removeItem('police_token'); window.location.href = 'login.html'; }
        
        const defaultInv = { "PPQ手槍": {total: 50, current: 45}, "無線電": {total: 30, current: 20}, "密錄器": {total: 60, current: 55}, "電擊槍": {total: 10, current: 8} };

        window.onload = function() { renderInv(); renderLogs(); };

        function renderInv() {
            let inv = JSON.parse(localStorage.getItem('police_inventory'));
            if(!inv) { inv = defaultInv; localStorage.setItem('police_inventory', JSON.stringify(inv)); }
            
            const grid = document.getElementById('invGrid');
            grid.innerHTML = '';
            
            for(let key in inv) {
                let p = (inv[key].current / inv[key].total) * 100;
                let color = p < 30 ? 'danger' : (p < 70 ? 'warning' : 'success');
                grid.insertAdjacentHTML('beforeend', `
                    <div class="col-md-3 col-6 mb-3">
                        <div class="card p-3 text-center h-100">
                            <h5 class="text-secondary">${key}</h5>
                            <h2 class="text-${color} fw-bold">${inv[key].current} <span class="fs-6 text-muted">/ ${inv[key].total}</span></h2>
                            <div class="progress mt-2" style="height:5px"><div class="progress-bar bg-${color}" style="width:${p}%"></div></div>
                        </div>
                    </div>
                `);
            }
        }

        function submitAction() {
            const type = document.getElementById('actType').value;
            const item = document.getElementById('actItem').value;
            const user = document.getElementById('actUser').value;
            
            if(!user) return; // 簡單防呆

            let inv = JSON.parse(localStorage.getItem('police_inventory'));
            if(type === 'borrow') {
                if(inv[item].current > 0) inv[item].current--;
            } else {
                if(inv[item].current < inv[item].total) inv[item].current++;
            }
            localStorage.setItem('police_inventory', JSON.stringify(inv));

            let logs = JSON.parse(localStorage.getItem('police_equip_logs')) || [];
            logs.unshift({ type, item, user, time: new Date().toLocaleTimeString() });
            localStorage.setItem('police_equip_logs', JSON.stringify(logs));

            bootstrap.Modal.getInstance(document.getElementById('actionModal')).hide();
            renderInv();
            renderLogs();
        }

        function renderLogs() {
            const logs = JSON.parse(localStorage.getItem('police_equip_logs')) || [];
            const tbody = document.getElementById('logBody');
            tbody.innerHTML = '';
            logs.slice(0, 5).forEach(l => {
                tbody.insertAdjacentHTML('beforeend', `<tr>
                    <td><span class="badge bg-${l.type==='borrow'?'danger':'success'}">${l.type==='borrow'?'領用':'歸還'}</span></td>
                    <td>${l.item}</td>
                    <td>${l.user}</td>
                    <td class="text-muted small">${l.time}</td>
                </tr>`);
            });
        }
    </script>
</body>
</html>
