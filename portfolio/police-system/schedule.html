<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案件結案報告書</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        if (localStorage.getItem('police_token') !== 'valid') { window.location.href = 'login.html'; }
    </script>
    <style>
        body { background-color: #0f172a; color: #f1f5f9; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .report-card { background-color: #1e293b; border: 1px solid #334155; padding: 2rem; border-radius: 12px; width: 100%; max-width: 600px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative; }
        .form-control, .form-select { background-color: #0f172a; border: 1px solid #334155; color: white; }
        .form-control:disabled { background-color: #334155; color: #94a3b8; }
        
        /* AI Button Style */
        .btn-ai {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            color: white;
            position: absolute;
            top: 2rem;
            right: 2rem;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            transition: 0.3s;
        }
        .btn-ai:hover { background: linear-gradient(135deg, #4f46e5, #7c3aed); transform: translateY(-2px); color: white; }
        .btn-ai:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    </style>
</head>
<body>

    <div class="report-card">
        <h4 class="mb-4 text-center pb-3 border-bottom border-secondary">案件結案報告書</h4>
        
        <!-- AI Polish Button -->
        <button class="btn btn-sm btn-ai rounded-pill px-3" onclick="polishReport()" id="aiBtn">
            <i class="fa-solid fa-wand-magic-sparkles me-2"></i>AI 智慧潤飾
        </button>

        <div class="row mb-3">
            <div class="col-6"><label class="text-secondary small">案件編號</label><input type="text" id="cId" class="form-control" disabled></div>
            <div class="col-6"><label class="text-secondary small">類型</label><input type="text" id="cType" class="form-control" disabled></div>
        </div>
        <div class="mb-3"><label class="text-secondary small">地點</label><input type="text" id="cLoc" class="form-control" disabled></div>
        
        <div class="mb-3">
            <label class="text-light d-flex justify-content-between">
                <span>處置結果說明</span>
                <span class="text-muted small" id="statusText">請輸入案發經過摘要，AI 可協助改寫</span>
            </label>
            <textarea class="form-control" id="cRes" rows="5" placeholder="例如：嫌犯在現場大吼大叫，我們到場後將其壓制，帶回派出所製作筆錄..."></textarea>
        </div>

        <div class="d-flex justify-content-between mt-4">
            <a href="records.html" class="btn btn-outline-secondary">返回列表</a>
            <button class="btn btn-success" onclick="submitCase()">確認結案</button>
        </div>
    </div>

    <script>
        const apiKey = ""; // API Key will be injected by the environment
        
        const params = new URLSearchParams(location.search);
        const id = parseInt(params.get('id'));
        let data = JSON.parse(localStorage.getItem('police_incidents')) || [];
        let item = data.find(i => i.id === id);

        if(item) {
            document.getElementById('cId').value = "#" + item.id;
            document.getElementById('cType').value = item.type;
            document.getElementById('cLoc').value = item.location;
            if(item.result) {
                document.getElementById('cRes').value = item.result;
                document.getElementById('cRes').disabled = true;
                document.querySelector('.btn-success').style.display = 'none';
                document.getElementById('aiBtn').style.display = 'none'; // Hide AI btn if closed
            }
        } else {
            document.querySelector('.report-card').innerHTML = '<div class="text-center text-danger">查無此案件資料</div><div class="text-center mt-3"><a href="records.html" class="btn btn-secondary">返回</a></div>';
        }

        async function polishReport() {
            const textarea = document.getElementById('cRes');
            const btn = document.getElementById('aiBtn');
            const status = document.getElementById('statusText');
            const userText = textarea.value.trim();

            if(!userText) { alert("請先輸入簡要的案發經過！"); return; }

            // Loading State
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>AI 改寫中...';
            status.innerHTML = '<span class="text-info">Gemini 正在將您的文字轉換為正式公文...</span>';
            textarea.disabled = true;

            const systemPrompt = `
                你是一個警局文書處理 AI。請將以下使用者的口語化描述，改寫為一份「正式、客觀、語氣專業」的警方結案報告。
                
                要求：
                1. 使用標準公文用語 (如：職、員警、嫌疑人、現場、帶返所)。
                2. 保持客觀，去除情緒性字眼。
                3. 直接輸出改寫後的內容，不要有任何開頭結尾的招呼語。
                
                使用者輸入：${userText}
            `;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: systemPrompt }] }]
                    })
                });

                const resData = await response.json();
                const polishedText = resData.candidates[0].content.parts[0].text;

                // 打字機效果輸出
                textarea.value = "";
                textarea.disabled = false;
                let i = 0;
                const typeWriter = setInterval(() => {
                    textarea.value += polishedText.charAt(i);
                    i++;
                    if (i > polishedText.length) {
                        clearInterval(typeWriter);
                        status.innerHTML = '<span class="text-success"><i class="fa-solid fa-check me-1"></i>改寫完成</span>';
                        btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles me-2"></i>再次潤飾';
                        btn.disabled = false;
                    }
                }, 10); // 速度

            } catch (error) {
                alert("AI 連線失敗，請檢查網路或稍後再試。");
                textarea.disabled = false;
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles me-2"></i>AI 智慧潤飾';
                status.innerText = "連線錯誤";
                console.error(error);
            }
        }

        function submitCase() {
            const res = document.getElementById('cRes').value;
            if(!res) return;
            item.status = "已結案";
            item.result = res;
            localStorage.setItem('police_incidents', JSON.stringify(data));
            
            // Log logic
            let logs = JSON.parse(localStorage.getItem('police_logs')) || [];
            logs.push({
                time: new Date().toLocaleString(),
                user: localStorage.getItem('current_user') || 'Admin',
                action: '案件結案',
                detail: `案件 #${item.id} 結案歸檔`,
                ip: 'Intranet'
            });
            localStorage.setItem('police_logs', JSON.stringify(logs));

            alert("結案成功！");
            location.href = 'records.html';
        }
    </script>
</body>
</html>
