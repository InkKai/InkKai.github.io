<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>警務智慧助理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 加入 Markdown 解析庫 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        if (localStorage.getItem('police_token') !== 'valid') { window.location.href = 'login.html'; }
    </script>
    <style>
        :root { --bg-dark: #0f172a; --card-bg: #1e293b; --text-light: #f1f5f9; }
        body { background-color: var(--bg-dark); color: var(--text-light); font-family: 'Segoe UI', sans-serif; }
        
        /* Sidebar Styling - White Text */
        .sidebar { height: 100vh; position: fixed; width: 250px; background-color: #111827; border-right: 1px solid #334151; padding-top: 20px; z-index: 1000;}
        .sidebar a { color: #ffffff !important; padding: 12px 25px; display: block; text-decoration: none; transition: 0.3s; font-weight: 500; }
        .sidebar a:hover, .sidebar a.active { background-color: rgba(56, 189, 248, 0.1); color: #38bdf8 !important; border-left: 4px solid #38bdf8; }
        .sidebar .text-muted { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-top: 20px; margin-bottom: 5px; padding-left: 25px; color: #e2e8f0 !important; }
        
        .main-content { margin-left: 250px; height: 100vh; display: flex; flex-direction: column; }
        .chat-area { flex: 1; overflow-y: auto; padding: 20px; background: #0f172a; }
        .input-area { padding: 20px; background: #1e293b; border-top: 1px solid #334155; }
        
        .msg { max-width: 80%; padding: 12px 18px; border-radius: 12px; margin-bottom: 15px; font-size: 0.95rem; line-height: 1.6; }
        .msg-ai { background: #334155; align-self: flex-start; border-bottom-left-radius: 2px; color: #e2e8f0; }
        .msg-user { background: #0ea5e9; align-self: flex-end; color: white; border-bottom-right-radius: 2px; margin-left: auto; }
        
        .msg-ai p { margin-bottom: 0.5rem; }
        .msg-ai ul { padding-left: 1.2rem; }
        .msg-ai strong { color: #38bdf8; }

        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; display: flex; overflow-x: auto; padding: 10px 0; border-bottom: 1px solid #334155; }
            .sidebar a { flex: 0 0 auto; padding: 8px 15px; border-left: none; }
            .sidebar .text-muted, .sidebar .text-center { display: none; }
            .main-content { margin-left: 0; height: calc(100vh - 60px); }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="text-center mb-4"><h4 class="text-white fw-bold"><i class="fa-solid fa-shield-cat me-2"></i>警務戰情</h4></div>
        <div class="text-muted">指揮作戰</div>
        <a href="dashboard.html"><i class="fa-solid fa-chart-line me-2"></i>戰情總覽</a>
        <a href="intelligence.html"><i class="fa-solid fa-eye me-2"></i>情資監控</a>
        <div class="text-muted">資源後勤</div>
        <a href="personnel.html"><i class="fa-solid fa-users me-2"></i>警力人事</a>
        <a href="equipment.html"><i class="fa-solid fa-gun me-2"></i>裝備倉儲</a>
        <div class="text-muted">分析決策</div>
        <a href="analysis.html"><i class="fa-solid fa-chart-pie me-2"></i>數據中心</a>
        <a href="records.html"><i class="fa-solid fa-folder-open me-2"></i>案卷紀錄</a>
        <div class="text-muted">輔助系統</div>
        <a href="knowledge.html"><i class="fa-solid fa-book me-2"></i>SOP 規章</a>
        <a href="ai_chat.html" class="active"><i class="fa-solid fa-robot me-2"></i>智慧助理</a>
        <a href="#" onclick="logout()" class="mt-4 text-danger"><i class="fa-solid fa-right-from-bracket me-2"></i>登出</a>
    </div>

    <div class="main-content">
        <div class="p-3 border-bottom border-secondary bg-dark d-flex align-items-center justify-content-between">
            <h5 class="m-0 text-light"><i class="fa-solid fa-robot text-info me-2"></i>警務智慧助理 (Gemini AI)</h5>
            <span class="badge bg-info text-dark"><i class="fa-solid fa-bolt me-1"></i>Powered by Gemini</span>
        </div>
        
        <div class="chat-area d-flex flex-column" id="chatBox">
            <div class="msg msg-ai">
                長官好！我是您的 AI 警務助理。<br>
                我已連結至勤務資料庫，您可以問我：
                <ul class="mb-0 mt-2">
                    <li>「幫我分析目前的治安熱點」</li>
                    <li>「寫一份巡邏任務的行前提示」</li>
                    <li>「遇到酒駕拒測的 SOP 是什麼？」</li>
                </ul>
            </div>
        </div>

        <div class="input-area d-flex gap-2">
            <input type="text" class="form-control bg-dark text-light border-secondary" id="userIn" placeholder="輸入指令或問題..." onkeypress="if(event.key==='Enter') send()">
            <button class="btn btn-info" onclick="send()" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        const apiKey = ""; // API Key will be injected by the environment

        function logout() { localStorage.removeItem('police_token'); window.location.href = 'login.html'; }

        async function send() {
            const input = document.getElementById('userIn');
            const btn = document.getElementById('sendBtn');
            const txt = input.value.trim();
            if(!txt) return;
            
            append(txt, 'user');
            input.value = '';
            input.disabled = true;
            btn.disabled = true;
            
            const loadingId = 'loading-' + Date.now();
            append('<i class="fa-solid fa-circle-notch fa-spin me-2"></i>AI 正在思考戰術...', 'ai', loadingId);

            const incidents = JSON.parse(localStorage.getItem('police_incidents')) || [];
            const activeCount = incidents.filter(i => i.status !== '已結案').length;
            const incidentTypes = incidents.map(i => i.type).join(', ');
            
            const systemPrompt = `
                你是一個專業的警察勤務指揮系統 AI 助理。
                請用繁體中文回答，語氣專業、簡潔、果斷，像一位經驗豐富的警官。
                
                目前系統狀態：
                - 未結案件數：${activeCount} 件
                - 最近案件類型：${incidentTypes}
                
                你的任務：
                1. 回答警員關於法規、SOP 的問題。
                2. 協助分析案件或提供戰術建議。
                3. 如果使用者要求導航頁面（如"帶我去報表"），請在回答最後加上 [NAV:頁面檔名]。
                
                使用者問題：${txt}
            `;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: systemPrompt }] }]
                    })
                });

                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;

                document.getElementById(loadingId).remove();
                
                let finalText = aiText;
                if(aiText.includes('[NAV:')) {
                    const navMatch = aiText.match(/\[NAV:(.*?)\]/);
                    if(navMatch) {
                        finalText = aiText.replace(navMatch[0], '');
                        setTimeout(() => {
                            window.location.href = navMatch[1];
                        }, 2000);
                    }
                }

                append(marked.parse(finalText), 'ai');

            } catch (error) {
                document.getElementById(loadingId).remove();
                append("❌ 連線異常，請稍後再試。", 'ai');
                console.error(error);
            } finally {
                input.disabled = false;
                btn.disabled = false;
                input.focus();
            }
        }

        function append(text, type, id = null) {
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `msg msg-${type}`;
            if(id) div.id = id;
            div.innerHTML = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
