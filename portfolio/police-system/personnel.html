<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>警力與人事管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        if (localStorage.getItem('police_token') !== 'valid') { window.location.href = 'login.html'; }
    </script>
    <style>
        :root { --bg-dark: #0f172a; --card-bg: #1e293b; --text-light: #f1f5f9; }
        body { background-color: var(--bg-dark); color: var(--text-light); font-family: 'Segoe UI', sans-serif; }
        
        /* Sidebar Styling - White Text */
        .sidebar { height: 100vh; position: fixed; width: 250px; background-color: #111827; border-right: 1px solid #334151; padding-top: 20px; z-index: 1000;}
        .sidebar a { color: #ffffff !important; padding: 12px 25px; display: block; text-decoration: none; transition: 0.3s; font-weight: 500; }
        .sidebar a:hover, .sidebar a.active { background-color: rgba(56, 189, 248, 0.1); color: #38bdf8 !important; border-left: 4px solid #38bdf8; }
        .sidebar .text-muted { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-top: 20px; margin-bottom: 5px; padding-left: 25px; color: #e2e8f0 !important; }
        
        .main-content { margin-left: 250px; padding: 20px; }
        
        .card { background-color: var(--card-bg); border: 1px solid #334155; }
        .table-dark { background-color: var(--card-bg); --bs-table-bg: var(--card-bg); color: #e2e8f0; }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }

        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; display: flex; overflow-x: auto; padding: 10px 0; border-bottom: 1px solid #334155; }
            .sidebar a { flex: 0 0 auto; padding: 8px 15px; border-left: none; }
            .sidebar .text-muted, .sidebar .text-center { display: none; }
            .main-content { margin-left: 0; padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="text-center mb-4"><h4 class="text-white fw-bold"><i class="fa-solid fa-shield-cat me-2"></i>警務戰情</h4></div>
        <div class="text-muted">指揮作戰</div>
        <a href="dashboard.html"><i class="fa-solid fa-chart-line me-2"></i>戰情總覽</a>
        <a href="intelligence.html"><i class="fa-solid fa-eye me-2"></i>情資監控</a>
        <div class="text-muted">資源後勤</div>
        <a href="personnel.html" class="active"><i class="fa-solid fa-users me-2"></i>警力人事</a>
        <a href="equipment.html"><i class="fa-solid fa-gun me-2"></i>裝備倉儲</a>
        <div class="text-muted">分析決策</div>
        <a href="analysis.html"><i class="fa-solid fa-chart-pie me-2"></i>數據中心</a>
        <a href="records.html"><i class="fa-solid fa-folder-open me-2"></i>案卷紀錄</a>
        <div class="text-muted">輔助系統</div>
        <a href="knowledge.html"><i class="fa-solid fa-book me-2"></i>SOP 規章</a>
        <a href="ai_chat.html"><i class="fa-solid fa-robot me-2"></i>智慧助理</a>
        <a href="#" onclick="logout()" class="mt-4 text-danger"><i class="fa-solid fa-right-from-bracket me-2"></i>登出</a>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-light">警力與人事管理</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addOfficerModal"><i class="fa-solid fa-user-plus"></i> 新增警員</button>
        </div>

        <div class="card">
            <div class="card-body table-responsive p-0">
                <table class="table table-dark table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>狀態</th><th>編號</th><th>姓名</th><th>職級</th><th>單位</th><th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="officerList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add Modal -->
    <div class="modal fade" id="addOfficerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-light border-secondary">
                <div class="modal-header border-secondary"><h5 class="modal-title">新增警力</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <div class="mb-3"><label>編號 (ID)</label><input type="text" class="form-control bg-dark text-light border-secondary" id="offId" placeholder="PC-XXXX"></div>
                    <div class="mb-3"><label>姓名</label><input type="text" class="form-control bg-dark text-light border-secondary" id="offName"></div>
                    <div class="mb-3"><label>單位</label><select class="form-select bg-dark text-light border-secondary" id="offUnit"><option>第一分隊</option><option>第二分隊</option><option>交通隊</option></select></div>
                </div>
                <div class="modal-footer border-secondary"><button class="btn btn-primary" onclick="addOfficer()">儲存</button></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function logout() { localStorage.removeItem('police_token'); window.location.href = 'login.html'; }

        const defaultOfficers = [
            { id: "PC-1025", name: "王大明", rank: "警員", unit: "第一分隊", status: "巡邏中" }, 
            { id: "PC-1028", name: "李小華", rank: "巡佐", unit: "第二分隊", status: "待命" },
            { id: "PC-2001", name: "陳建國", rank: "所長", unit: "所長室", status: "會議中" }
        ];

        window.onload = function() { renderList(); };

        function renderList() {
            let list = JSON.parse(localStorage.getItem('police_officers'));
            if (!list || list.length === 0) { list = defaultOfficers; localStorage.setItem('police_officers', JSON.stringify(list)); }
            
            const tbody = document.getElementById('officerList');
            tbody.innerHTML = '';
            
            list.forEach((o, i) => {
                let color = o.status === '巡邏中' ? '#22c55e' : (o.status === '待命' ? '#eab308' : '#64748b');
                tbody.insertAdjacentHTML('beforeend', `
                    <tr>
                        <td><span class="status-dot" style="background-color:${color}"></span>${o.status}</td>
                        <td>${o.id}</td>
                        <td class="fw-bold">${o.name}</td>
                        <td>${o.rank}</td>
                        <td>${o.unit}</td>
                        <td><button class="btn btn-sm btn-outline-danger" onclick="delOfficer(${i})"><i class="fa-solid fa-trash"></i></button></td>
                    </tr>
                `);
            });
        }

        function addOfficer() {
            const id = document.getElementById('offId').value;
            const name = document.getElementById('offName').value;
            if(!id || !name) return;
            
            let list = JSON.parse(localStorage.getItem('police_officers')) || [];
            list.push({ id, name, rank: "警員", unit: document.getElementById('offUnit').value, status: "待命" });
            localStorage.setItem('police_officers', JSON.stringify(list));
            
            bootstrap.Modal.getInstance(document.getElementById('addOfficerModal')).hide();
            renderList();
        }

        function delOfficer(idx) {
            let list = JSON.parse(localStorage.getItem('police_officers'));
            list.splice(idx, 1);
            localStorage.setItem('police_officers', JSON.stringify(list));
            renderList();
        }
    </script>
</body>
</html>
