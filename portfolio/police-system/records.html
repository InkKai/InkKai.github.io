<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案卷紀錄</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        if (localStorage.getItem('police_token') !== 'valid') { window.location.href = 'login.html'; }
    </script>
    <style>
        :root { --bg-dark: #0f172a; --card-bg: #1e293b; --text-light: #f1f5f9; }
        body { background-color: var(--bg-dark); color: var(--text-light); font-family: 'Segoe UI', sans-serif; }
        
        /* Sidebar Styling - White Text */
        .sidebar { height: 100vh; position: fixed; width: 250px; background-color: #111827; border-right: 1px solid #334151; padding-top: 20px; z-index: 1000;}
        .sidebar a { color: #ffffff !important; padding: 12px 25px; display: block; text-decoration: none; transition: 0.3s; font-weight: 500; }
        .sidebar a:hover, .sidebar a.active { background-color: rgba(56, 189, 248, 0.1); color: #38bdf8 !important; border-left: 4px solid #38bdf8; }
        .sidebar .text-muted { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-top: 20px; margin-bottom: 5px; padding-left: 25px; color: #e2e8f0 !important; }
        
        .main-content { margin-left: 250px; padding: 20px; }

        .card { background-color: var(--card-bg); border: 1px solid #334155; }
        .table-dark { background-color: var(--card-bg); --bs-table-bg: var(--card-bg); color: #e2e8f0; }
        .nav-tabs .nav-link { color: #94a3b8; border-color: transparent; }
        .nav-tabs .nav-link.active { background-color: #1e293b; color: #38bdf8; border-color: #334155 #334155 #1e293b; }
        
        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; display: flex; overflow-x: auto; padding: 10px 0; border-bottom: 1px solid #334155; }
            .sidebar a { flex: 0 0 auto; padding: 8px 15px; border-left: none; }
            .sidebar .text-muted, .sidebar .text-center { display: none; }
            .main-content { margin-left: 0; padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="text-center mb-4"><h4 class="text-white fw-bold"><i class="fa-solid fa-shield-cat me-2"></i>警務戰情</h4></div>
        <div class="text-muted">指揮作戰</div>
        <a href="dashboard.html"><i class="fa-solid fa-chart-line me-2"></i>戰情總覽</a>
        <a href="intelligence.html"><i class="fa-solid fa-eye me-2"></i>情資監控</a>
        <div class="text-muted">資源後勤</div>
        <a href="personnel.html"><i class="fa-solid fa-users me-2"></i>警力人事</a>
        <a href="equipment.html"><i class="fa-solid fa-gun me-2"></i>裝備倉儲</a>
        <div class="text-muted">分析決策</div>
        <a href="analysis.html"><i class="fa-solid fa-chart-pie me-2"></i>數據中心</a>
        <a href="records.html" class="active"><i class="fa-solid fa-folder-open me-2"></i>案卷紀錄</a>
        <div class="text-muted">輔助系統</div>
        <a href="knowledge.html"><i class="fa-solid fa-book me-2"></i>SOP 規章</a>
        <a href="ai_chat.html"><i class="fa-solid fa-robot me-2"></i>智慧助理</a>
        <a href="#" onclick="logout()" class="mt-4 text-danger"><i class="fa-solid fa-right-from-bracket me-2"></i>登出</a>
    </div>

    <div class="main-content">
        <h2 class="text-light mb-4">歷史案卷與紀錄</h2>

        <ul class="nav nav-tabs border-secondary mb-3">
            <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#cases"><i class="fa-solid fa-list me-2"></i>案件列表</a></li>
            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#logs"><i class="fa-solid fa-history me-2"></i>系統日誌</a></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="cases">
                <div class="card">
                    <div class="card-body p-0 table-responsive">
                        <table class="table table-dark table-hover mb-0">
                            <thead><tr><th>狀態</th><th>ID</th><th>類型</th><th>時間</th><th>地點</th><th>操作</th></tr></thead>
                            <tbody id="caseBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <div class="tab-pane fade" id="logs">
                <div class="alert alert-info bg-dark border-info text-info"><i class="fa-solid fa-circle-info me-2"></i>僅顯示最近 50 筆操作紀錄 (Audit Logs)</div>
                <div class="card">
                    <div class="card-body p-0 table-responsive">
                        <table class="table table-dark table-sm mb-0">
                            <thead><tr><th>時間</th><th>使用者</th><th>動作</th></tr></thead>
                            <tbody id="logBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function logout() { localStorage.removeItem('police_token'); window.location.href = 'login.html'; }

        window.onload = function() {
            // Cases
            const incidents = JSON.parse(localStorage.getItem('police_incidents')) || [];
            const caseBody = document.getElementById('caseBody');
            if(incidents.length === 0) caseBody.innerHTML = '<tr><td colspan="6" class="text-center text-muted p-4">暫無案件資料</td></tr>';
            
            incidents.forEach(i => {
                let badge = i.status === '已結案' ? 'secondary' : 'danger';
                let btn = `<a href="report.html?id=${i.id}" class="btn btn-sm btn-outline-light">詳情</a>`;
                caseBody.insertAdjacentHTML('beforeend', `<tr><td><span class="badge bg-${badge}">${i.status}</span></td><td>#${i.id}</td><td>${i.type}</td><td>${i.time}</td><td>${i.location}</td><td>${btn}</td></tr>`);
            });

            // Logs (Mock)
            const logs = [
                {time: "10:05:22", user: "Admin", action: "登入系統"},
                {time: "10:06:15", user: "Admin", action: "查看儀表板"},
                {time: "10:10:00", user: "System", action: "自動備份資料庫"}
            ];
            const logBody = document.getElementById('logBody');
            logs.forEach(l => {
                logBody.insertAdjacentHTML('beforeend', `<tr><td class="text-muted font-monospace">${l.time}</td><td class="text-info">${l.user}</td><td>${l.action}</td></tr>`);
            });
        }
    </script>
</body>
</html>
