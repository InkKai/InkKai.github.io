<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudStay | 智慧房控</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            /* 換回一張比較溫馨的房間背景 */
            background: url('https://images.unsplash.com/photo-1618773928121-c32242e63f39?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
        }

        /* 毛玻璃卡片容器 (覆蓋 style.css 的預設 container) */
        .dashboard {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            font-size: 1.8rem;
            margin-bottom: 5px;
            font-weight: bold;
        }

        p.subtitle {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* 功能網格 (2x2 排列) */
        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .menu-btn {
            background: white;
            border: none;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #333;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            height: 120px; /* 稍微調矮一點，不然 6 格會太長 */
        }

        .menu-btn:active {
            transform: scale(0.95);
        }

        .icon-box {
            font-size: 1.8rem;
            margin-bottom: 10px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 不同功能的顏色配置 */
        .lock-style { background: #ffeaa7; color: #fdcb6e; }
        .light-style { background: #fab1a0; color: #e17055; }
        .ac-style { background: #74b9ff; color: white; }
        .curtain-style { background: #a29bfe; color: white; } /* 新增：紫色給窗簾 */
        .camera-style { background: #636e72; color: white; } /* 新增：灰色給監控 */
        .checkout-style { background: #2c3e50; color: white; }

        .btn-label {
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* 底部資訊 */
        .footer-info {
            text-align: center;
            font-size: 0.8rem;
            color: #999;
            margin-top: 20px;
            border-top: 1px solid rgba(0,0,0,0.1);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <header>
            <h1>CloudStay</h1>
            <p class="subtitle">Room 702 • 歡迎入住</p>
        </header>

        <div class="grid-menu">
            
            <a href="lock.html" class="menu-btn">
                <div class="icon-box lock-style">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <span class="btn-label">門鎖控制</span>
            </a>

            <a href="lights.html" class="menu-btn">
                <div class="icon-box light-style">
                    <i class="fa-regular fa-lightbulb"></i>
                </div>
                <span class="btn-label">燈光情境</span>
            </a>

            <a href="ac.html" class="menu-btn">
                <div class="icon-box ac-style">
                    <i class="fa-solid fa-snowflake"></i>
                </div>
                <span class="btn-label">冷氣空調</span>
            </a>

            <a href="curtains.html" class="menu-btn">
                <div class="icon-box curtain-style">
                    <i class="fa-solid fa-person-booth"></i>
                </div>
                <span class="btn-label">智慧窗簾</span>
            </a>

            <a href="camera.html" class="menu-btn">
                <div class="icon-box camera-style">
                    <i class="fa-solid fa-video"></i>
                </div>
                <span class="btn-label">門口監控</span>
            </a>

            <a href="checkout.html" class="menu-btn">
                <div class="icon-box checkout-style">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </div>
                <span class="btn-label">辦理退房</span>
            </a>

        </div>

        <div class="footer-info">
            <p>Wi-Fi: CloudStay / Password: 8888</p>
        </div>
    </div>

    </body>
</html>
