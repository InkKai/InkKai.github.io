<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辦理退房 | CloudStay</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* 標題區 */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        /* 帳單明細卡 */
        .bill-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid #eee;
        }

        .bill-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: #555;
        }

        .bill-row.total {
            border-top: 2px dashed #ddd;
            padding-top: 10px;
            margin-top: 10px;
            font-weight: bold;
            color: #2c3e50;
            font-size: 1.1rem;
        }

        /* 評分星星 */
        .rating-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .rating-title {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 10px;
        }

        .stars {
            font-size: 2rem;
            color: #ddd;
            cursor: pointer;
        }

        .stars i {
            transition: color 0.2s;
            margin: 0 2px;
        }

        .stars i.active {
            color: #f1c40f; /* 金黃色 */
        }

        /* 按鈕 */
        .btn-checkout {
            width: 100%;
            padding: 15px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-checkout:hover {
            background: #1a252f;
            transform: translateY(-2px);
        }

        /* --- 處理中的覆蓋層 (Loading) --- */
        .processing-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            border-radius: 25px; /* 讓遮罩也跟著圓角 */
        }

        .processing-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #2c3e50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .status-msg {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .sub-status {
            font-size: 0.8rem;
            color: #999;
        }

        /* --- 完成畫面 (Success) --- */
        .check-icon {
            font-size: 4rem;
            color: #2ed573;
            margin-bottom: 20px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }

    </style>
</head>
<body>

    <a href="index.html" class="back-btn"><i class="fa-solid fa-chevron-left"></i></a>

    <div class="container">
        
        <div id="checkoutContent">
            <header>
                <h2>辦理退房</h2>
                <p class="subtitle">Room 702 - 尊爵套房</p>
            </header>

            <div class="bill-card">
                <div class="bill-row">
                    <span>住宿費用 (1晚)</span>
                    <span>$3,500</span>
                </div>
                <div class="bill-row">
                    <span>客房服務 (餐點)</span>
                    <span>$450</span>
                </div>
                <div class="bill-row">
                    <span>Mini Bar</span>
                    <span>$120</span>
                </div>
                <div class="bill-row total">
                    <span>總計金額</span>
                    <span>$4,070</span>
                </div>
            </div>

            <div class="rating-section">
                <div class="rating-title">本次住宿體驗滿意度</div>
                <div class="stars" id="starContainer">
                    <i class="fa-solid fa-star" data-value="1"></i>
                    <i class="fa-solid fa-star" data-value="2"></i>
                    <i class="fa-solid fa-star" data-value="3"></i>
                    <i class="fa-solid fa-star" data-value="4"></i>
                    <i class="fa-solid fa-star" data-value="5"></i>
                </div>
            </div>

            <button class="btn-checkout" onclick="startCheckout()">
                <i class="fa-solid fa-credit-card"></i> 確認結帳並退房
            </button>
        </div>

        <div class="processing-overlay" id="overlay">
            <div class="spinner" id="spinner"></div>
            <div class="check-icon" id="successIcon" style="display:none;">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <p class="status-msg" id="msg">正在連線至銀行...</p>
            <p class="sub-status" id="subMsg">請勿關閉視窗</p>
        </div>
    </div>

    <script src="js/checkout.js"></script>

</body>
</html>
