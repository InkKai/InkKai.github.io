<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧冷氣控制</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: '微軟正黑體', sans-serif;
            user-select: none;
        }

        body {
            /* 配合首頁的背景圖，保持一致性 */
            background: url('https://images.unsplash.com/photo-1618773928121-c32242e63f39?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .ac-controller {
            background: rgba(255, 255, 255, 0.95); /* 稍微帶點透明度 */
            backdrop-filter: blur(10px);
            width: 320px;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            transition: all 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .ac-controller.off {
            filter: grayscale(100%);
            opacity: 0.8;
            background: #e0e0e0;
        }

        /* 顯示螢幕區域 - 預設藍色 (冷氣) */
        .display-screen {
            background: linear-gradient(135deg, #6dd5fa 0%, #2980b9 100%);
            color: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
            position: relative;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background 0.8s ease; /* 顏色轉換時有漸變動畫 */
        }

        /* 新增：暖氣模式的橘色背景 */
        .display-screen.heat-mode {
            background: linear-gradient(135deg, #f6d365 0%, #ff7e5f 100%);
        }

        .ac-controller.off .display-screen {
            background: #333;
            color: #444;
        }

        .temp-display {
            font-size: 4rem;
            font-weight: bold;
            line-height: 1;
        }

        .unit {
            font-size: 1.5rem;
            vertical-align: super;
        }

        .mode-text {
            margin-top: 10px;
            font-size: 1.1rem; /* 稍微加大字體 */
            opacity: 0.95;
        }

        .off-text {
            display: none;
            font-size: 1.5rem;
            color: #555;
        }
        .ac-controller.off .off-text { display: block; }
        .ac-controller.off .temp-display, 
        .ac-controller.off .mode-text { display: none; }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.1s, background 0.3s;
            background: #f1f3f6;
            color: #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .btn:active { transform: scale(0.95); }

        .btn-temp {
            background: white;
            border: 2px solid #eee;
        }

        .power-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: #ff4757;
            color: white;
            font-size: 1.5rem;
            margin-top: 10px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3);
            transition: all 0.3s;
        }

        .power-btn:hover { transform: scale(1.1); }

        /* 返回按鈕 (回到首頁用) */
        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #333;
            font-size: 1.2rem;
            text-decoration: none;
            opacity: 0.5;
            transition: opacity 0.3s;
            z-index: 10;
        }
        .back-link:hover { opacity: 1; }

    </style>
</head>
<body>

    <a href="index.html" class="back-link"><i class="fa-solid fa-chevron-left"></i></a>

    <div class="ac-controller" id="controller">
        <div class="display-screen" id="displayScreen">
            <div class="temp-display" id="tempText">26<span class="unit">°C</span></div>
            <div class="mode-text" id="modeText">
                <i class="fa-solid fa-snowflake"></i> 冷氣模式
            </div>
            <div class="off-text">OFF</div>
        </div>

        <div class="controls">
            <button class="btn btn-temp" onclick="changeTemp(-1)">
                <i class="fa-solid fa-minus"></i>
            </button>
            <button class="btn btn-temp" onclick="changeTemp(1)">
                <i class="fa-solid fa-plus"></i>
            </button>
            
            <button class="btn" onclick="changeMode()">
                <i class="fa-solid fa-wind"></i> 模式
            </button>
            <button class="btn" onclick="toggleFan()">
                <i class="fa-solid fa-fan"></i> 風速
            </button>
        </div>

        <button class="power-btn" onclick="togglePower()">
            <i class="fa-solid fa-power-off"></i>
        </button>
    </div>

    <script>
        let powerOn = true;
        let temperature = 26;
        
        // 1. 在這裡新增了 '暖氣模式' 和對應的火焰圖示 'fa-fire'
        let modes = ['冷氣模式', '暖氣模式', '除濕模式', '送風模式'];
        let modeIcons = ['fa-snowflake', 'fa-fire', 'fa-droplet', 'fa-wind'];
        
        let currentModeIndex = 0;

        const controller = document.getElementById('controller');
        const displayScreen = document.getElementById('displayScreen'); // 抓取螢幕元素
        const tempText = document.getElementById('tempText');
        const modeText = document.getElementById('modeText');

        function togglePower() {
            powerOn = !powerOn;
            if (powerOn) {
                controller.classList.remove('off');
            } else {
                controller.classList.add('off');
            }
        }

        function changeTemp(amount) {
            if (!powerOn) return;
            temperature += amount;
            if (temperature > 32) temperature = 32; // 暖氣通常可以調高一點
            if (temperature < 16) temperature = 16;
            updateDisplay();
        }

        function changeMode() {
            if (!powerOn) return;
            currentModeIndex = (currentModeIndex + 1) % modes.length;
            updateDisplay();
        }

        function toggleFan() {
            if (!powerOn) return;
            // 為了不干擾畫面，改用 console log 或簡單提示
            // alert("風速切換"); 
        }

        function updateDisplay() {
            // 更新數字
            tempText.innerHTML = `${temperature}<span class="unit">°C</span>`;
            
            // 更新模式文字與圖示
            modeText.innerHTML = `<i class="fa-solid ${modeIcons[currentModeIndex]}"></i> ${modes[currentModeIndex]}`;

            // 2. 判斷邏輯：如果是暖氣模式，加上橘色背景 class；否則移除
            if (modes[currentModeIndex] === '暖氣模式') {
                displayScreen.classList.add('heat-mode');
            } else {
                displayScreen.classList.remove('heat-mode');
            }
        }
    </script>
</body>
</html>
