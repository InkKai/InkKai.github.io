<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貪吃蛇 - Kai Game Station</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* 遊戲專用樣式 */
        .game-area {
            max-width: 450px; /* 稍微寬一點容納按鈕 */
        }

        /* 畫布 Canvas 設定 */
        #gameCanvas {
            background-color: #000;
            border: 4px solid #4cc9f0;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(76, 201, 240, 0.2);
            display: block;
            margin: 0 auto;
            /* 讓畫布在手機上會自動縮放 */
            width: 100%;
            height: auto;
            max-width: 400px;
        }

        .score-display {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #2dba4e;
        }

        /* 手機用的方向鍵 */
        .controls {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            max-width: 200px;
            margin-left: auto;
            margin-right: auto;
        }

        .d-btn {
            background-color: #16213e;
            color: #4cc9f0;
            border: 2px solid #4cc9f0;
            padding: 15px;
            font-size: 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            touch-action: manipulation; /* 防止手機點兩下放大 */
        }

        .d-btn:active {
            background-color: #4cc9f0;
            color: #000;
        }

        /* 排列按鈕位置 */
        .up { grid-column: 2; }
        .left { grid-column: 1; }
        .down { grid-column: 2; }
        .right { grid-column: 3; }

    </style>
</head>
<body>

    <header>
        <h1>🐍 貪吃蛇大冒險</h1>
        <p>吃掉紅色的蘋果，不要咬到自己！</p>
    </header>

    <div class="game-area">
        <div class="score-display">得分：<span id="score">0</span></div>
        
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="controls">
            <button class="d-btn up" onclick="changeDirection('up')">⬆️</button>
            <button class="d-btn left" onclick="changeDirection('left')">⬅️</button>
            <button class="d-btn down" onclick="changeDirection('down')">⬇️</button>
            <button class="d-btn right" onclick="changeDirection('right')">➡️</button>
        </div>

        <button onclick="startGame()" style="margin-top: 20px; width: 100%;">▶️ 開始 / 重來</button>
    </div>

    <a href="../index.html" class="back-btn">⬅️ 回到遊戲大廳</a>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d'); // 建立 2D 繪圖環境
        const scoreEl = document.getElementById('score');

        // 遊戲設定
        const gridSize = 20; // 每一格的大小 (20x20像素)
        const tileCount = canvas.width / gridSize; // 總共有幾格 (400/20 = 20格)
        
        let score = 0;
        let gameInterval;
        
        // 蛇的身體 (一開始在中間)
        let snake = [{x: 10, y: 10}]; 
        let food = {x: 15, y: 15};
        
        // 移動方向 (x=0, y=0 代表不動)
        let dx = 0;
        let dy = 0;

        // 避免一瞬間按兩次導致自殺的變數
        let changingDirection = false;

        // 電腦鍵盤監聽
        document.addEventListener('keydown', keyDownEvent);

        function startGame() {
            // 重置所有變數
            snake = [{x: 10, y: 10}];
            food = {x: 5, y: 5};
            dx = 1; dy = 0; // 預設往右跑
            score = 0;
            scoreEl.innerText = score;
            
            if (gameInterval) clearInterval(gameInterval);
            // 每 150 毫秒刷新一次畫面 (數字越小越快)
            gameInterval = setInterval(gameLoop, 150);
        }

        function gameLoop() {
            if (isGameOver()) {
                alert(`💀 遊戲結束！得分：${score}`);
                clearInterval(gameInterval);
                return;
            }

            changingDirection = false;
            
            clearCanvas();
            moveSnake();
            drawFood();
            drawSnake();
        }

        // 1. 清空畫布
        function clearCanvas() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // 2. 畫蛇
        function drawSnake() {
            ctx.fillStyle = '#2dba4e'; // 蛇的顏色 (綠)
            snake.forEach(part => {
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        // 3. 畫食物
        function drawFood() {
            ctx.fillStyle = '#ff2e63'; // 食物顏色 (紅)
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        // 4. 移動邏輯
        function moveSnake() {
            // 蛇頭的新位置
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            
            // 把新頭加到陣列最前面
            snake.unshift(head);

            // 判斷有沒有吃到食物
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreEl.innerText = score;
                generateFood(); // 產生新食物
                // 吃到食物不用 pop (尾巴)，所以蛇會變長
            } else {
                snake.pop(); // 沒吃到，尾巴去掉一格，維持長度
            }
        }

        // 5. 產生隨機食物
        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            // (進階還可以防止食物生在蛇身上，這裡先簡單做)
        }

        // 6. 死亡判斷
        function isGameOver() {
            // 撞牆
            if (snake[0].x < 0 || snake[0].x >= tileCount || 
                snake[0].y < 0 || snake[0].y >= tileCount) {
                return true;
            }
            
            // 撞自己 (從身體第1節開始檢查有沒有跟頭重疊)
            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) {
                    return true;
                }
            }
            return false;
        }

        // 7. 控制方向 (鍵盤)
        function keyDownEvent(e) {
            if (changingDirection) return; // 防止快速連按
            changingDirection = true;

            const keyPressed = e.keyCode;
            
            if (keyPressed === 37 && dx !== 1) { dx = -1; dy = 0; } // 左
            if (keyPressed === 38 && dy !== 1) { dx = 0; dy = -1; } // 上
            if (keyPressed === 39 && dx !== -1) { dx = 1; dy = 0; } // 右
            if (keyPressed === 40 && dy !== -1) { dx = 0; dy = 1; } // 下
        }

        // 8. 控制方向 (手機按鈕)
        function changeDirection(dir) {
            if (changingDirection) return;
            changingDirection = true;

            if (dir === 'left' && dx !== 1) { dx = -1; dy = 0; }
            if (dir === 'up' && dy !== 1) { dx = 0; dy = -1; }
            if (dir === 'right' && dx !== -1) { dx = 1; dy = 0; }
            if (dir === 'down' && dy !== -1) { dx = 0; dy = 1; }
        }
    </script>
</body>
</html>
