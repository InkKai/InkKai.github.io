<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>駭客任務 - Kai Game Station</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* 遊戲專用樣式 */
        body {
            background-color: #000; /* 強制全黑背景 */
            overflow: hidden; /* 防止捲動 */
        }

        .game-area {
            position: relative;
            width: 100%;
            height: 100vh; /* 佔滿整個螢幕 */
            margin: 0;
            padding: 0;
            max-width: none; /* 取消原本的寬度限制 */
            border: none;
            border-radius: 0;
        }

        canvas {
            display: block;
            background-color: #000;
        }

        /* 介面層 (分數、按鈕) */
        .ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0f0; /* 駭客綠 */
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #0f0;
            z-index: 10;
            pointer-events: none; /* 讓點擊穿透 */
        }

        .score-display {
            font-size: 2rem;
            font-weight: bold;
        }

        .start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 20px 40px;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 0 15px #0f0;
            z-index: 20;
            font-family: 'Courier New', monospace;
        }

        .start-btn:hover {
            background: #0f0;
            color: #000;
        }

        /* 手機用的隱藏輸入框 */
        #mobileInput {
            position: absolute;
            opacity: 0;
            top: -1000px;
        }
        
        /* 手機鍵盤喚起按鈕 */
        .keyboard-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 15px;
            background: #0f0;
            color: #000;
            border: none;
            border-radius: 50%;
            font-size: 1.5rem;
            z-index: 30;
            display: none; /* 電腦版隱藏 */
            cursor: pointer;
            pointer-events: auto;
        }

        @media (max-width: 768px) {
            .keyboard-btn { display: block; }
        }

        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 30;
            border: 1px solid #0f0;
            color: #0f0;
            background: rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="game-area">
        <canvas id="matrixCanvas"></canvas>
        
        <div class="ui-layer">
            <div class="score-display">SCORE: <span id="score">0</span></div>
            <div id="lives">LIVES: 100%</div>
        </div>

        <button class="start-btn" onclick="startGame()" id="startBtn">INITIALIZE MATRIX</button>
        
        <input type="text" id="mobileInput" autocomplete="off">
        <button class="keyboard-btn" onclick="focusMobileInput()">⌨️</button>

        <a href="../index.html" class="back-btn">⬅️ EXIT</a>
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const startBtn = document.getElementById('startBtn');
        const mobileInput = document.getElementById('mobileInput');

        let width, height;
        let drops = []; // 存放掉落的字元
        let score = 0;
        let health = 100;
        let gameRunning = false;
        let spawnRate = 60; // 產生速度 (數字越小越快)
        let frameCount = 0;
        let speedMultiplier = 1;

        // 設定全螢幕 Canvas
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 字元池 (可以改用 0 和 1，但用英文字母比較好玩)
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

        class Drop {
            constructor() {
                this.x = Math.random() * width;
                this.y = -20;
                this.text = chars[Math.floor(Math.random() * chars.length)];
                this.speed = (Math.random() * 2 + 1) * speedMultiplier;
                this.fontSize = Math.random() * 20 + 15; // 15px ~ 35px
                
                // 駭客綠色，但有點變化
                this.color = '#0f0';
                if(Math.random() > 0.9) this.color = '#fff'; // 偶爾有白色高亮
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.font = `bold ${this.fontSize}px 'Courier New'`;
                ctx.fillText(this.text, this.x, this.y);
            }

            update() {
                this.y += this.speed;
            }
        }

        function startGame() {
            score = 0;
            health = 100;
            drops = [];
            gameRunning = true;
            speedMultiplier = 1;
            spawnRate = 60;
            
            scoreEl.innerText = score;
            livesEl.innerText = `LIVES: ${health}%`;
            startBtn.style.display = 'none';
            
            // 如果是手機，自動聚焦輸入框
            focusMobileInput();

            loop();
        }

        function loop() {
            if (!gameRunning) return;

            // 1. 畫出半透明黑色背景 (造成拖影效果)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);

            // 2. 產生新掉落物
            frameCount++;
            if (frameCount % Math.floor(spawnRate) === 0) {
                drops.push(new Drop());
                // 隨著時間變難
                if(spawnRate > 10) spawnRate -= 0.1;
                speedMultiplier += 0.001;
            }

            // 3. 更新與繪製每個掉落物
            for (let i = drops.length - 1; i >= 0; i--) {
                const drop = drops[i];
                drop.update();
                drop.draw();

                // 觸底扣血
                if (drop.y > height) {
                    health -= 5; // 掉一個扣 5%
                    livesEl.innerText = `LIVES: ${health}%`;
                    livesEl.style.color = 'red';
                    setTimeout(() => livesEl.style.color = '#0f0', 100);
                    drops.splice(i, 1); // 移除

                    if (health <= 0) {
                        gameOver();
                    }
                }
            }

            requestAnimationFrame(loop);
        }

        // 監聽鍵盤輸入 (電腦)
        window.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            checkInput(e.key.toUpperCase());
        });

        // 監聽虛擬鍵盤輸入 (手機)
        mobileInput.addEventListener('input', (e) => {
            if (!gameRunning) return;
            const char = e.target.value.slice(-1).toUpperCase(); // 取最後一個輸入的字
            checkInput(char);
            e.target.value = ''; // 清空輸入框
        });

        function checkInput(key) {
            // 找出畫面上所有符合按鍵的字
            // 優先消除最下面的 (y 最大的)
            let matchIndex = -1;
            let maxY = -100;

            for (let i = 0; i < drops.length; i++) {
                if (drops[i].text === key) {
                    if (drops[i].y > maxY) {
                        maxY = drops[i].y;
                        matchIndex = i;
                    }
                }
            }

            if (matchIndex !== -1) {
                // 消除成功！
                createExplosion(drops[matchIndex].x, drops[matchIndex].y);
                drops.splice(matchIndex, 1);
                score += 10;
                scoreEl.innerText = score;
            }
        }

        // 簡單的爆炸特效
        function createExplosion(x, y) {
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(x, y - 10, 20, 0, Math.PI * 2);
            ctx.fill();
        }

        function gameOver() {
            gameRunning = false;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, width, height);
            
            ctx.fillStyle = '#0f0';
            ctx.font = 'bold 40px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('SYSTEM FAILURE', width/2, height/2 - 20);
            
            ctx.font = '20px Courier New';
            ctx.fillText(`FINAL SCORE: ${score}`, width/2, height/2 + 30);
            
            startBtn.style.display = 'block';
            startBtn.innerText = 'REBOOT SYSTEM';
        }

        function focusMobileInput() {
            mobileInput.focus();
        }
    </script>
</body>
</html>
