<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剪刀石頭布 - Kai Game Station</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* 針對這個遊戲的特別樣式 */
        .choices {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        
        .choice-btn {
            background-color: #16213e;
            border: 2px solid #4cc9f0;
            border-radius: 50%; /* 變成圓形 */
            width: 100px;
            height: 100px;
            font-size: 3rem;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .choice-btn:hover {
            transform: scale(1.1); /* 放大效果 */
            background-color: #0f3460;
            box-shadow: 0 0 15px #4cc9f0;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin: 20px auto;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 10px;
        }

        .score-box {
            text-align: center;
        }

        .score-num {
            font-size: 2rem;
            font-weight: bold;
            color: #e94560;
        }

        #battle-msg {
            font-size: 1.5rem;
            min-height: 50px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>✌️ 剪刀石頭布 🖐️</h1>
        <p>跟電腦來一場決鬥吧！</p>
    </header>

    <div class="game-area">
        <div class="score-board">
            <div class="score-box">
                <div>你</div>
                <div id="userScore" class="score-num">0</div>
            </div>
            <div class="score-box">
                <div>電腦</div>
                <div id="compScore" class="score-num">0</div>
            </div>
        </div>

        <h3>請出拳：</h3>
        
        <div class="choices">
            <button class="choice-btn" onclick="play('✊')">✊</button>
            <button class="choice-btn" onclick="play('🖐️')">🖐️</button>
            <button class="choice-btn" onclick="play('✌️')">✌️</button>
        </div>

        <p id="battle-msg">準備好了嗎？</p>
    </div>

    <a href="../index.html" class="back-btn">⬅️ 回到遊戲大廳</a>

    <script>
        // --- 遊戲邏輯 ---
        
        let userScore = 0;
        let compScore = 0;

        // 這裡用陣列 (Array) 存這三種拳
        const options = ['✊', '🖐️', '✌️'];

        function play(userChoice) {
            // 1. 電腦隨機出拳 (0, 1, 2 隨機選一個)
            const randomIndex = Math.floor(Math.random() * 3);
            const compChoice = options[randomIndex];

            // 2. 判斷輸贏
            let result = "";

            if (userChoice === compChoice) {
                result = "平手！😐";
                document.getElementById('battle-msg').style.color = "white";
            } 
            else if (
                (userChoice === '✊' && compChoice === '✌️') || 
                (userChoice === '🖐️' && compChoice === '✊') || 
                (userChoice === '✌️' && compChoice === '🖐️')
            ) {
                result = "你贏了！🎉";
                userScore++; // 分數 +1
                document.getElementById('battle-msg').style.color = "#4cc9f0"; // 藍色
            } 
            else {
                result = "電腦贏了！🤖";
                compScore++; // 電腦分數 +1
                document.getElementById('battle-msg').style.color = "#e94560"; // 紅色
            }

            // 3. 更新畫面
            document.getElementById('battle-msg').innerHTML = 
                `你出 ${userChoice} vs 電腦出 ${compChoice}<br><strong>${result}</strong>`;
            
            document.getElementById('userScore').innerText = userScore;
            document.getElementById('compScore').innerText = compScore;
        }
    </script>
</body>
</html>
