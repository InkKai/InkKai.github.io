<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kai's Game Station 🎮</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>👾 Kai 的遊戲中心</h1>
        <p>Press Start to Play</p>
    </header>

    <div class="game-container">
        <div class="game-card" onclick="location.href='games/guess-number.html'">
            <div class="icon">🔢</div>
            <h3>猜數字</h3>
            <p>挑戰你的直覺 (1-100)</p>
        </div>

        <div class="game-card" onclick="location.href='games/rps.html'">
            <div class="icon">✌️</div>
            <h3>剪刀石頭布</h3>
            <p>經典對決</p>
        </div>

        <div class="game-card" onclick="location.href='games/whack-a-mole.html'">
            <div class="icon">🔨</div>
            <h3>打地鼠</h3>
            <p>手速大挑戰</p>
        </div>

        <div class="game-card" onclick="location.href='games/snake.html'">
			<div class="icon">🐍</div>
			<h3>貪吃蛇</h3>
			<p>經典不敗 (支援手機)</p>
		</div>
	
		<div class="game-card" onclick="location.href='games/memory.html'">
			<div class="icon">🧠</div>
			<h3>記憶翻牌</h3>
			<p>3D 卡片配對</p>
		</div>
		
		<div class="game-card" onclick="location.href='games/breakout.html'">
			<div class="icon">🧱</div>
			<h3>打磚塊</h3>
			<p>物理碰撞挑戰</p>
		</div>
		
		<div class="game-card" onclick="location.href='games/matrix.html'">
			<div class="icon">⌨️</div>
			<h3>駭客任務</h3>
			<p>代碼雨打字防禦</p>
		</div>
		
		<div class="game-card" onclick="location.href='games/space-shooter.html'">
			<div class="icon">🚀</div>
			<h3>星際射擊</h3>
			<p>消滅入侵者</p>
		</div>
		
		<div class="game-card" onclick="location.href='games/flappy.html'">
			<div class="icon">🐦</div>
			<h3>飛翔小鳥</h3>
			<p>點擊飛行，小心撞牆</p>
		</div>
	</div>

    <footer>
        <p>Designed by Kai | <a href="#">關於作者</a></p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
